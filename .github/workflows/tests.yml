name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  normalization:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Static analysis
        run: npm run lint

      - name: Validate JSON and configuration contracts
        run: npm run check:config

      - name: Unit and fixture integration tests (no live services)
        run: npm test
